name: Build Android APK (Sniper Paper Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Run Unit & Regression Test Suite
        run: npm test

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Sign Android APK
        run: npm run build:apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniper-paper-bot.apk
          path: sniper-paper-bot.apk
          retention-days: 14
